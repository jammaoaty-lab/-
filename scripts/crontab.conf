# ==========================================
# AI Drama 平台定时任务配置
# 请使用: crontab -e 编辑，然后复制此内容
# ==========================================

# 每日凌晨1点: 生成日报
0 1 * * * /bin/bash /data/wwwroot/ai_drama_platform/scripts/generate_daily_report.sh >> /data/wwwroot/ai_drama_platform/logs/cron_report.log 2>&1

# 每周日凌晨2点: 日志切割
0 2 * * 0 /bin/bash /data/wwwroot/ai_drama_platform/scripts/logrotate.sh >> /data/wwwroot/ai_drama_platform/logs/cron_logrotate.log 2>&1

# 每10分钟: 清理临时文件
*/10 * * * * /bin/bash /data/wwwroot/ai_drama_platform/scripts/cleanup_temp.sh >> /data/wwwroot/ai_drama_platform/logs/cron_cleanup.log 2>&1

# 每5分钟: 监控队列进程
*/5 * * * * /bin/bash /data/wwwroot/ai_drama_platform/scripts/monitor_queue.sh >> /data/wwwroot/ai_drama_platform/logs/cron_queue.log 2>&1

# 每小时: 清理过期验证码
0 * * * * /bin/bash /data/wwwroot/ai_drama_platform/scripts/cleanup_expired.sh >> /data/wwwroot/ai_drama_platform/logs/cron_expired.log 2>&1

